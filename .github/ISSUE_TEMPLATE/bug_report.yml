name: Bug report
description: Report incorrect authorization behavior or a software defect
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve HWAAM.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem and the expected decision.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include a minimal policy and request with secrets removed.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, operating system, and HWAAM version.
    validations:
      required: true
