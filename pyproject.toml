[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hwaam-authorization-mesh"
version = "0.1.0"
description = "Reference implementation of the Human-Workload-Agent Authorization Mesh"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "Sunil Gentyala"},
  {name = "Suresh Kumar Darisi"}
]
keywords = [
  "authorization",
  "access-control",
  "ai-agents",
  "zero-trust",
  "least-privilege",
  "delegation",
  "policy-as-code"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security"
]
dependencies = []

[project.scripts]
hwaam = "hwaam.cli:main"

[project.urls]
Homepage = "https://sunilgentyala.github.io/hwaam-authorization-mesh/"
Repository = "https://github.com/sunilgentyala/hwaam-authorization-mesh"
Issues = "https://github.com/sunilgentyala/hwaam-authorization-mesh/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
